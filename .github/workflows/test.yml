name: CI documental

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-documental-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentos:
    name: ci-tecnico
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar documentos Markdown
        run: python scripts/validate_markdown.py

  testes-sonar:
    name: Testes Sonar
    if: always()
    needs:
      - documentos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Registrar aplicabilidade da análise Sonar
        shell: bash
        run: |
          {
            echo "## Testes Sonar"
            echo
            echo "Análise Sonar: **não aplicável** neste workflow documental, que não configura análise nem cobertura Sonar. Este check depende da validação real de Markdown em ci-tecnico."
            echo
            echo "Resultado de ci-tecnico (validação Markdown): ${{ needs.documentos.result }}."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.documentos.result }}" != "success" ]]; then
            echo "::error::O gate Testes Sonar não pode passar porque ci-tecnico não concluiu com sucesso."
            exit 1
          fi

  report-ci:
    name: Reportar resultado do CI na PR
    if: always() && github.event_name == 'pull_request'
    needs:
      - documentos
      - testes-sonar
    uses: delta-app-ofc/.github/.github/workflows/report_ci.yml@d30cc2161336efb9ed9d9b49524a373fe3cafd03
    with:
      needs_results: ${{ toJSON(needs) }}
    secrets:
      DELTA_ORG_AUTOMATION_TOKEN: ${{ secrets.DELTA_ORG_AUTOMATION_TOKEN }}
    permissions:
      actions: read
      issues: write
      pull-requests: write
